[package]
name = "ansibleops"
version = "1.2.0"
edition = "2021"
description = "AnsibleOps — desktop control center for Ansible: playbooks, ad-hoc, inventory, roles, GitOps, compliance, web API"
authors = ["flytimopheev-sketch <flytimopheev-sketch@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/flytimopheev-sketch/ansibleops"
homepage = "https://github.com/flytimopheev-sketch/ansibleops"
keywords = ["ansible", "gui", "devops", "automation", "redos"]
categories = ["command-line-utilities", "development-tools"]
default-run = "ansibleops"

[dependencies]
eframe = "0.29"
egui = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
syntect = "5"
petgraph = "0.6"
rfd = "0.14"
ureq = "2"
base64 = "0.22"