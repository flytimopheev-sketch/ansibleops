<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120f1e"/>
      <stop offset=".5" stop-color="#1b1533"/>
      <stop offset="1" stop-color="#0d0b16"/>
    </linearGradient>
    <radialGradient id="neb1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7a5cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1000" height="1400" fill="url(#bg)"/>
  <ellipse cx="280" cy="420" rx="420" ry="300" fill="url(#neb1)"/>
  <ellipse cx="760" cy="900" rx="460" ry="340" fill="url(#neb2)"/>
  <ellipse cx="620" cy="260" rx="300" ry="220" fill="url(#neb1)" opacity=".7"/>

  <g filter="url(#soft)" fill="#cfd6ff">
    <ellipse cx="300" cy="500" rx="260" ry="90" opacity=".10"/>
    <ellipse cx="700" cy="760" rx="300" ry="110" opacity=".08"/>
    <ellipse cx="420" cy="1080" rx="280" ry="100" opacity=".09"/>
  </g>

  <g fill="#ffffff">
    <circle cx="60" cy="90" r="2"/><circle cx="180" cy="200" r="1.4"/><circle cx="320" cy="120" r="1.8"/>
    <circle cx="470" cy="70" r="1.2"/><circle cx="640" cy="150" r="2.2"/><circle cx="820" cy="90" r="1.5"/>
    <circle cx="930" cy="220" r="1.8"/><circle cx="90" cy="340" r="1.3"/><circle cx="240" cy="410" r="2"/>
    <circle cx="410" cy="330" r="1.2"/><circle cx="580" cy="410" r="1.6"/><circle cx="760" cy="340" r="1.3"/>
    <circle cx="900" cy="430" r="2"/><circle cx="70" cy="560" r="1.6"/><circle cx="210" cy="640" r="1.2"/>
    <circle cx="880" cy="600" r="1.4"/><circle cx="940" cy="720" r="1.8"/><circle cx="120" cy="780" r="2"/>
    <circle cx="300" cy="860" r="1.3"/><circle cx="520" cy="900" r="1.7"/><circle cx="700" cy="980" r="1.2"/>
    <circle cx="860" cy="900" r="1.6"/><circle cx="90" cy="1000" r="1.4"/><circle cx="240" cy="1100" r="1.8"/>
    <circle cx="430" cy="1180" r="1.3"/><circle cx="620" cy="1120" r="2"/><circle cx="800" cy="1180" r="1.4"/>
    <circle cx="930" cy="1100" r="1.7"/><circle cx="150" cy="1260" r="1.5"/><circle cx="360" cy="1320" r="1.9"/>
    <circle cx="560" cy="1280" r="1.2"/><circle cx="760" cy="1330" r="1.6"/><circle cx="910" cy="1270" r="1.3"/>
  </g>
  <g fill="#9fe8ff">
    <circle cx="500" cy="180" r="2.4"/><circle cx="140" cy="480" r="2"/><circle cx="860" cy="480" r="2.2"/>
    <circle cx="340" cy="1020" r="2"/><circle cx="680" cy="1240" r="2.3"/>
  </g>
  <g fill="#ffe9a8">
    <circle cx="760" cy="180" r="1.8"/><circle cx="220" cy="940" r="1.7"/><circle cx="880" cy="1040" r="1.8"/>
  </g>

  <g filter="url(#glow)" transform="translate(500 620)">
    <path d="M0 -260 L225 -130 L225 130 L0 260 L-225 130 L-225 -130 Z"
          fill="none" stroke="#e8ecff" stroke-width="14" stroke-linejoin="round"/>
    <path d="M40 -150 L-70 20 L-10 20 L-40 150 L70 -20 L10 -20 Z" fill="#e8ecff"/>
  </g>
</svg>